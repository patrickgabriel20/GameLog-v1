<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameLog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>GameLog</h1>

        <p>Minha coleção de jogos e minhas avaliações.</p>
    </header>


    <input id="pesquisa" placeholder="Pesquisar um jogo...">

    <button id="botaoPesquisar">Pesquisar</button>


    <div id="resultados"></div>


    <h2 class="tituloBiblioteca">🎮 Meus Jogos</h2>

    <h2 class="tituloEstatisticas">📊 Minhas Estatísticas</h2>

<div id="estatisticas">

    <div class="estatistica">
        <h3>🎮 Total</h3>
        <p id="totalJogos">0</p>
    </div>

    <div class="estatistica">
        <h3>✅ Zerados</h3>
        <p id="jogosZerados">0</p>
    </div>

    <div class="estatistica">
        <h3>🎮 Jogando</h3>
        <p id="jogosJogando">0</p>
    </div>

    <div class="estatistica">
        <h3>📋 Quero jogar</h3>
        <p id="jogosQueroJogar">0</p>
    </div>

    <div class="estatistica">
        <h3>⭐ Média</h3>
        <p id="mediaNotas">0/10</p>
    </div>

</div>


    <select id="filtroStatus">

        <option value="todos">🎮 Todos</option>

        <option value="zerado">✅ Zerados</option>

        <option value="jogando">🎮 Jogando</option>

        <option value="quero-jogar">📋 Quero jogar</option>

    </select>


    <div id="biblioteca"></div>


    <!-- ==========================
         JANELA DE EDIÇÃO
    =========================== -->

    <div id="janelaEdicao" class="janelaEdicao">

        <div class="caixaEdicao">

            <h2>✏️ Editar jogo</h2>

            <p id="nomeJogoEdicao"></p>


            <label>⭐ Nota:</label>

            <input
                type="number"
                id="notaEdicao"
                min="0"
                max="10"
            >


            <label>🎮 Status:</label>

            <select id="statusEdicao">

                <option value="quero-jogar">
                    📋 Quero jogar
                </option>

                <option value="jogando">
                    🎮 Jogando
                </option>

                <option value="zerado">
                    ✅ Zerado
                </option>

            </select>


            <div class="botoesEdicao">

                <button id="salvarEdicao">
                    💾 Salvar
                </button>

                <button id="cancelarEdicao">
                    ❌ Cancelar
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
